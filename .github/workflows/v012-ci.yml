name: Camera Market CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/v0.12-supabase-integration
      - codex/**

permissions:
  contents: read

concurrency:
  group: v012-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile backend and scripts
        run: python -m compileall -q backend scripts
      - name: Run concurrency and refresh-cache tests
        env:
          DATABASE_URL: sqlite:///./camera_market_ci.db
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_concurrency_guard.py backend/tests/test_product_refresh_cache.py
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./camera_market_ci.db
          PYTHONPATH: backend
        run: pytest -q backend/tests

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        env:
          INTERNAL_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm --prefix frontend run build
      - name: Audit production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  postgres-migrations:
    name: PostgreSQL 17 migration and trust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: camera_market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d camera_market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Create current PostgreSQL schema
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/camera_market
          PYTHONPATH: backend
        run: python -c "from app.database import Base, engine; import app.models; Base.metadata.create_all(engine)"
      - name: Provision Supabase API roles in ephemeral PostgreSQL
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:5432/camera_market -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          SQL
      - name: Apply V0.15 migration and verify trust invariants
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/camera_market
          PYTHONPATH: backend
        run: python -m app.migrate supabase/migrations --from 20260711090000_v015_production_readiness.sql --verify
      - name: Verify purchase migration on isolated legacy schema
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/camera_market
        run: python scripts/check-purchase-migration.py

  worker-tests:
    name: Cloudflare entry tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Run worker contract tests
        run: node --test deploy/cloudflare-public/worker.test.mjs

  data-and-secrets:
    name: Seed and client-secret validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate generated seed
        run: python scripts/validate-v012-seed.py
      - name: Scan browser-delivered code for secrets
        run: python scripts/check-client-secrets.py
      - name: Verify cloud runtime config
        run: python scripts/check-cloud-runtime.py
      - name: Report concurrency hotspots
        run: python scripts/concurrency-audit.py
