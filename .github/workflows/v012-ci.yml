name: V0.12 CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feat/v0.12-supabase-integration

permissions:
  contents: read

concurrency:
  group: v012-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Compile backend and scripts
        run: python -m compileall -q backend scripts
      - name: Run concurrency and refresh-cache tests
        env:
          DATABASE_URL: sqlite:///./camera_market_ci.db
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_concurrency_guard.py backend/tests/test_product_refresh_cache.py
      - name: Run backend tests
        env:
          DATABASE_URL: sqlite:///./camera_market_ci.db
          PYTHONPATH: backend
        run: pytest -q backend/tests

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
        run: npm --prefix frontend run build
      - name: Audit production dependencies
        continue-on-error: true
        run: npm --prefix frontend audit --omit=dev --audit-level=high

  worker-tests:
    name: Cloudflare entry tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run worker contract tests
        run: node --test deploy/cloudflare-public/worker.test.mjs

  data-and-secrets:
    name: Seed and client-secret validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated seed
        run: python scripts/validate-v012-seed.py
      - name: Scan browser-delivered code for secrets
        run: python scripts/check-client-secrets.py
      - name: Report concurrency hotspots
        run: python scripts/concurrency-audit.py
