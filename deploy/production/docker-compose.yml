services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backend:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point to Supabase/Postgres in cloud production}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be the public cloud HTTPS URL}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS must be the public cloud HTTPS URL}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      SCHEDULER_INTERVAL_MINUTES: ${SCHEDULER_INTERVAL_MINUTES:-60}
      CRAWLER_CONCURRENCY: ${CRAWLER_CONCURRENCY:-3}
      CRAWLER_TIMEOUT_MS: ${CRAWLER_TIMEOUT_MS:-45000}
      CRAWLER_MIN_INTERVAL_MINUTES: ${CRAWLER_MIN_INTERVAL_MINUTES:-30}
      CRAWLER_RETRIES: ${CRAWLER_RETRIES:-1}
      CRAWLER_HEADLESS: ${CRAWLER_HEADLESS:-true}
      JD_API_URL: ${JD_API_URL:-https://api.jd.com/routerjson}
      JD_APP_KEY: ${JD_APP_KEY:-}
      JD_APP_SECRET: ${JD_APP_SECRET:-}
      JD_UNION_ID: ${JD_UNION_ID:-}
      JD_GOODS_QUERY_METHOD: ${JD_GOODS_QUERY_METHOD:-jd.union.open.goods.query}
      TAOBAO_API_URL: ${TAOBAO_API_URL:-https://eco.taobao.com/router/rest}
      TAOBAO_APP_KEY: ${TAOBAO_APP_KEY:-}
      TAOBAO_APP_SECRET: ${TAOBAO_APP_SECRET:-}
      TAOBAO_ADZONE_ID: ${TAOBAO_ADZONE_ID:-}
      TAOBAO_GOODS_SEARCH_METHOD: ${TAOBAO_GOODS_SEARCH_METHOD:-taobao.tbk.dg.material.optional}
      PDD_API_URL: ${PDD_API_URL:-https://gw-api.pinduoduo.com/api/router}
      PDD_CLIENT_ID: ${PDD_CLIENT_ID:-}
      PDD_CLIENT_SECRET: ${PDD_CLIENT_SECRET:-}
      PDD_PID: ${PDD_PID:-}
      PDD_GOODS_SEARCH_METHOD: ${PDD_GOODS_SEARCH_METHOD:-pdd.ddk.goods.search}
      EBAY_API_URL: ${EBAY_API_URL:-https://api.ebay.com}
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_MARKETPLACE_ID: ${EBAY_MARKETPLACE_ID:-EBAY_US}
      AMAZON_PAAPI_HOST: ${AMAZON_PAAPI_HOST:-webservices.amazon.com}
      AMAZON_PAAPI_REGION: ${AMAZON_PAAPI_REGION:-us-east-1}
      AMAZON_ACCESS_KEY: ${AMAZON_ACCESS_KEY:-}
      AMAZON_SECRET_KEY: ${AMAZON_SECRET_KEY:-}
      AMAZON_PARTNER_TAG: ${AMAZON_PARTNER_TAG:-}
      AMAZON_PARTNER_TYPE: ${AMAZON_PARTNER_TYPE:-Associates}
      INTEGRATION_OFFER_TTL_HOURS: ${INTEGRATION_OFFER_TTL_HOURS:-12}
      INTEGRATION_AUTO_INGEST: ${INTEGRATION_AUTO_INGEST:-true}
      OUTBOUND_WEBHOOK_URL: ${OUTBOUND_WEBHOOK_URL:-}
      OUTBOUND_WEBHOOK_SECRET: ${OUTBOUND_WEBHOOK_SECRET:-}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-woywgfoqurumrkyoznnb}
      SUPABASE_URL: ${SUPABASE_URL:-https://woywgfoqurumrkyoznnb.supabase.co}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/system/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - app_data:/data
      - ../../logs:/app/logs
      - ../../backend/app/static:/app/app/static

  frontend:
    build:
      context: ../../frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE: ""
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL must be the public cloud HTTPS URL}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-https://woywgfoqurumrkyoznnb.supabase.co}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  app_data:
  caddy_data:
  caddy_config:
